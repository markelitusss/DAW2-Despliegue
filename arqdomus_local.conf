<VirtualHost *:80>
	ServerName www.arqdomus.local
	Redirect permanent / https://www.arqdomus.local/
</VirtualHost>

<VirtualHost *:443>
	ServerName www.arqdomus.local
	DocumentRoot /var/www/arqdomus

	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/arqdomus.crt
	SSLCertificateKeyFile /etc/ssl/private/arqdomus.key

	<Directory /var/www/arqdomus>
		Options -indexes
		Require all granted
	</Directory>
	
	Alias /documentos/ /srv/arqdomus/
	<Directory /srv/arqdomus/>
		Options -indexes
		Require all granted
	</Directory>

	Redirect 301 /index_old.html /index.html
	
	ErrorDocument 403 /error/403.html
	ErrorDocument 404 /error/404.html
	ErrorDocument 500 /error/500.html
</VirtualHost>
