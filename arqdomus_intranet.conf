<VirtualHost *:80>
	ServerName intranet.arqdomus.local
	Redirect permanent / https://intranet.arqdomus.local/
</VirtualHost>

<VirtualHost *:443>
	ServerName intranet.arqdomus.local
	DocumentRoot /var/www/intranet_arqdomus

	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/intranet.crt
	SSLCertificateKeyFile /etc/ssl/private/intranet.key

	<Directory /var/www/intranet_arqdomus/>
		Require all denied
		<RequireAll>
			Require valid-user
			Require ip 127.0.0.1
			AuthUserFile /etc/apache2/.htpasswd-personal
			AuthName "Zona de acceso restringido"
			AuthType Basic
		</RequireAll>
	</Directory>
</VirtualHost>
